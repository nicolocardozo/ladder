# Build personale non firmata da sviluppatore Apple: firma ad hoc, solo per questo Mac.
appId: dev.nicolocardozo.ladder
productName: Ladder
directories:
  output: dist
  buildResources: resources
files:
  - out/**/*
  - package.json
asar: true
# node-pty è l'unico modulo nativo: resta fuori dall'asar (lo spawn-helper deve essere un file eseguibile vero).
asarUnpack:
  - "**/node_modules/node-pty/**"
npmRebuild: false
mac:
  target: dir
  icon: ../../app-icon/macos/ladder-circuit.icns
  category: public.app-category.developer-tools
  identity: "-"
  hardenedRuntime: false
  gatekeeperAssess: false
