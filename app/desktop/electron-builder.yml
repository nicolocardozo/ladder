# Personal build not signed by an Apple developer: ad hoc signature, for this Mac only.
appId: dev.nicolocardozo.ladder
productName: Ladder
directories:
  output: dist
  buildResources: resources
files:
  - out/**/*
  - package.json
  # Of the Agent SDK's Claude binary, only the one for the architecture being built is included.
  - "!**/node_modules/@anthropic-ai/claude-agent-sdk-darwin-!(${arch})/**"
# The `ladder` CLI lives outside the asar: the (executable) script launches the bundle with the app binary and ELECTRON_RUN_AS_NODE=1.
extraResources:
  - from: out/main/cli.js
    to: cli/ladder.js
  # Chunks shared with main (rollup splits them out): the bundle looks for them in ./chunks.
  - from: out/main/chunks
    to: cli/chunks
  - from: src/cli/bin/ladder
    to: bin/ladder
asar: true
# node-pty is the only native module: it stays outside the asar (spawn-helper must be a real executable file).
asarUnpack:
  - "**/node_modules/node-pty/**"
  # The SDK's Claude Code binary must be a real executable, not inside the asar.
  - "**/node_modules/@anthropic-ai/claude-agent-sdk-darwin-*/**"
npmRebuild: false
mac:
  target: dir
  icon: ../../brand/app-icon/macos/ladder-circuit.icns
  category: public.app-category.developer-tools
  identity: "-"
  hardenedRuntime: false
  gatekeeperAssess: false
