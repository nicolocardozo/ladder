# Distributable build: signed with a Developer ID and notarized. Run it with `pnpm release:mac`, which finds the certificate.
extends: electron-builder.yml
directories:
  output: dist/release
  buildResources: resources
mac:
  # The architecture (arm64 or x64) is chosen by scripts/release-mac.mjs, which builds a DMG and a zip for each.
  # The DMG is for the first download from the website, the zip for automatic updates.
  target:
    - dmg
    - zip
  # Applies to the zip; the DMG has its own name further down.
  artifactName: ${productName}-${version}-${arch}-mac.${ext}
  hardenedRuntime: true
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  notarize: true
# Auto-updates: the app reads latest-mac.yml from the public releases of ladder-releases.
# Published by scripts/publish-release.mjs, not by electron-builder.
publish:
  provider: github
  owner: nicolocardozo
  repo: ladder-releases
  releaseType: release
# DMG window: light Circuit background (source and notes in resources/dmg/background.svg), the app on the left and Applications on the right.
dmg:
  title: Ladder
  # Always with the architecture in the name: Ladder-0.1.0-arm64.dmg and Ladder-0.1.0-x64.dmg
  artifactName: ${productName}-${version}-${arch}.${ext}
  background: resources/dmg/background.png
  iconSize: 112
  window:
    width: 760
    height: 450
  contents:
    - x: 230
      y: 200
      type: file
    - x: 530
      y: 200
      type: link
      path: /Applications
