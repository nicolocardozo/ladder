# No account or secret here: `wrangler deploy` uses the account you logged in with.
name = "ladder-relay"
main = "src/index.ts"
compatibility_date = "2026-10-20"

[observability]
enabled = false

[[durable_objects.bindings]]
name = "RELAY"
class_name = "RelayDurableObject"

# Durable Object with SQLite storage: the only kind available on the free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelayDurableObject"]
